<div class="profile-layout">
  <app-sidebar />
  <main class="profile-main">
    <div class="profile-wrapper">

      <div *ngIf="isLoading" class="profile-loading">Loading profile…</div>
      <div *ngIf="loadError" class="profile-error">{{ loadError }}</div>

      <div class="profile-card" *ngIf="!isLoading && userProfile">

        <!-- Header: avatar + name -->
        <div class="card-header">
          <div class="avatar-circle">
            <img *ngIf="userProfile.profilePicture" [src]="userProfile.profilePicture" class="avatar-img" alt="Profile">
            <span *ngIf="!userProfile.profilePicture" class="avatar-initials">{{ initials }}</span>
          </div>
          <div class="header-info">
            <h2 class="profile-name">{{ userProfile.firstName }} {{ userProfile.lastName }}</h2>
          </div>
        </div>

        <div class="card-divider"></div>

        <!-- Full name (read-only) -->
        <div class="field-group">
          <label class="field-label">Full name</label>
          <input class="field-input" type="text" [value]="userProfile.firstName + ' ' + userProfile.lastName" readonly>
        </div>

        <!-- Email (read-only) -->
        <div class="field-group">
          <label class="field-label">Email</label>
          <input class="field-input" type="email" [value]="userProfile.email" readonly>
        </div>

        <!-- Update Picture Panel -->
        <div class="panel" *ngIf="showPicturePanel">
          <p class="panel-title">Update Profile Picture</p>
          <div class="picture-upload-row">
            <img *ngIf="picturePreview" [src]="picturePreview" class="picture-preview" alt="Preview">
            <label class="upload-btn" [class.uploading]="pictureUploading">
              {{ pictureUploading ? 'Uploading…' : (picturePreview ? 'Change' : 'Choose File') }}
              <input type="file" accept="image/*" (change)="onFileSelected($event)" [disabled]="pictureUploading || pictureUpdating" hidden>
            </label>
          </div>
          <div *ngIf="pictureError" class="panel-error">{{ pictureError }}</div>
          <div class="panel-actions">
            <button class="btn-panel-save" (click)="submitPictureUpdate()" [disabled]="pictureUpdating || pictureUploading || !picturePreview">
              {{ pictureUpdating ? 'Saving…' : 'Save' }}
            </button>
            <button class="btn-panel-cancel" (click)="closePicturePanel()" [disabled]="pictureUpdating">Cancel</button>
          </div>
        </div>

        <!-- Change Password Panel -->
        <div class="panel" *ngIf="showPasswordPanel">
          <p class="panel-title">Change Password</p>
          <div class="pw-field-wrapper">
            <input
              [type]="showCurrentPassword ? 'text' : 'password'"
              class="panel-input"
              placeholder="Current password"
              [(ngModel)]="currentPassword"
              [disabled]="passwordChanging">
            <button type="button" class="pw-eye-btn" (click)="showCurrentPassword = !showCurrentPassword">
              <svg *ngIf="!showCurrentPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg *ngIf="showCurrentPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <div class="pw-field-wrapper pw-gap">
            <input
              [type]="showNewPassword ? 'text' : 'password'"
              class="panel-input"
              placeholder="New password"
              [(ngModel)]="newPassword"
              [disabled]="passwordChanging">
            <button type="button" class="pw-eye-btn" (click)="showNewPassword = !showNewPassword">
              <svg *ngIf="!showNewPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg *ngIf="showNewPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <div class="pw-field-wrapper pw-gap">
            <input
              [type]="showConfirmNewPassword ? 'text' : 'password'"
              class="panel-input"
              placeholder="Confirm new password"
              [(ngModel)]="confirmPassword"
              [disabled]="passwordChanging">
            <button type="button" class="pw-eye-btn" (click)="showConfirmNewPassword = !showConfirmNewPassword">
              <svg *ngIf="!showConfirmNewPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg *ngIf="showConfirmNewPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <div *ngIf="confirmPassword && !passwordsMatch" class="panel-error">Passwords do not match.</div>
          <div *ngIf="passwordError" class="panel-error">{{ passwordError }}</div>
          <div *ngIf="passwordSuccess" class="panel-success">{{ passwordSuccess }}</div>
          <div class="panel-actions">
            <button
              class="btn-panel-save"
              (click)="submitPasswordChange()"
              [disabled]="passwordChanging || !passwordsMatch || !newPassword.trim() || !currentPassword.trim() || !confirmPassword.trim()">
              {{ passwordChanging ? 'Saving…' : 'Save' }}
            </button>
            <button class="btn-panel-cancel" (click)="closePasswordPanel()" [disabled]="passwordChanging">Cancel</button>
          </div>
        </div>

        <!-- Bottom action bar -->
        <div class="card-actions">
          <div class="actions-left">
            <button class="btn-action" (click)="openPicturePanel()" [class.active]="showPicturePanel">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
              Upload profile photo
            </button>
            <button class="btn-action" (click)="openPasswordPanel()" [class.active]="showPasswordPanel">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              Change password
            </button>
          </div>

        </div>

      </div>
    </div>
  </main>
</div>
