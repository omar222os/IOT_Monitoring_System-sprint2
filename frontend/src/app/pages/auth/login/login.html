<div class="container">

  <!-- LEFT SIDE -->
  <div class="left-panel">
    <div class="left-content">
      <h1>Real-Time Sensor Intelligence</h1>
      <p>Experience the future of enterprise monitoring with precision tracking and automated analytics for every connected node in your ecosystem.</p>
      <div class="divider"></div>
    </div>
  </div>

  <!-- RIGHT SIDE -->
  <div class="right-panel">

    <div class="login-box">
      <h2>Sign In</h2>
      <p class="subtitle">Access your dashboard</p>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <label>Email</label>
        <input type="email" formControlName="email" placeholder="admin@network.local">

        <label>Password</label>
        <div class="input-wrapper">
          <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="••••••••">
          <button type="button" class="eye-btn" (click)="showPassword = !showPassword">
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>

        <button type="submit" class="login-btn" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Signing In…' : 'Sign In to Dashboard' }}
        </button>

        <div *ngIf="loginError" class="login-error">{{ loginError }}</div>

      </form>

      <p class="switch-text">
        Don’t have an account?
        <a (click)="goSignup()">Sign Up</a>
      </p>

      <p class="footer-text">Authorized Personnel Only</p>
    </div>

  </div>

</div>
