services:
  database:
    image: mysql:8.0
    container_name: iot-database
    environment:
      MYSQL_DATABASE: monitoring
      MYSQL_ROOT_PASSWORD: rootpassword123
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword123"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  backend:
    image: jaidazeidan/iot-backend:v1.4
    platform: linux/amd64
    container_name: backend-container
    entrypoint: ["/bin/sh", "-c",
      "export SPRING_DATASOURCE_PASSWORD=rootpassword123 &&
       export JWT_SECRET=myjwtsecretkey123456789012345678 &&
       exec java -Djava.security.egd=file:/dev/./urandom -jar app.jar"]
    environment:
      JWT_EXPIRATION_MS: 86400000
    volumes:
      - backend_data:/app/data
    networks:
      - backend-net
      - frontend-net
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    user: "1001:1001"
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --output /dev/null http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
    ports:
      - "8081:8080"

  frontend:
    image: jaidazeidan/iot-frontend:v1.4
    platform: linux/amd64
    container_name: iot-frontend
    networks:
      - frontend-net
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    user: "101:101"
    ports:
      - "80:8080"

networks:
  backend-net:
    driver: bridge
  frontend-net:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  backend_data:
    driver: local